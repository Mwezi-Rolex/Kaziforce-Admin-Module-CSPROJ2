# journald retention drop-in for the Kaziforce VM.
#
# Install (on the VM):
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/systemd/journald-retention.conf /etc/systemd/journald.conf.d/
#   sudo systemctl restart systemd-journald
#
# Effect: the journal is capped at 200 MB on disk and entries older than 30
# days are vacuumed, so a busy demo week cannot fill the OS disk with logs.

[Journal]
SystemMaxUse=200M
MaxRetentionSec=30day
