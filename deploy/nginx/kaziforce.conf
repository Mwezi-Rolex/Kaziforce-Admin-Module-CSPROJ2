# Kaziforce — Nginx site configuration (HTTP, no domain required)
#
# Serves the built SPA from /var/www/kaziforce and proxies /api/ to the Node API
# on loopback. The model service (ml/service.py) binds 127.0.0.1:8000 and is
# deliberately NOT proxied here: there is no location block for it, so it is
# unreachable from the public internet. Do not add one.
#
# Install to /etc/nginx/sites-available/kaziforce, then:
#   ln -s /etc/nginx/sites-available/kaziforce /etc/nginx/sites-enabled/kaziforce
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# For HTTPS see kaziforce-https.conf.example (run certbot first).

server {
    listen 80;
    listen [::]:80;

    # Without a domain, replace with the VPS public IP (or leave the default
    # server so any Host header matches). With a domain:
    #   server_name kaziforce.example.com www.kaziforce.example.com;
    server_name _;

    root /var/www/kaziforce;
    index index.html;

    # Uploads are not part of this console; keep the body limit small.
    client_max_body_size 1m;

    # ---- Security headers -------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # The SPA loads fonts from Google Fonts; Tailwind emits inline style blocks,
    # so style-src needs 'unsafe-inline'. If you edit this, test the console in a
    # browser afterwards — a wrong CSP silently breaks the page.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---- Compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- API proxy --------------------------------------------------------
    # TRUST_PROXY must be set in the API environment so the rate limiter sees
    # the real client IP from X-Forwarded-For.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # Never cache API responses or the audit CSV.
        add_header Cache-Control "no-store" always;
    }

    # ---- Static assets ----------------------------------------------------
    # Vite emits content-hashed filenames under /assets, safe to cache hard.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin an old bundle.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # ---- SPA fallback -----------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Hardening --------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/kaziforce.access.log;
    error_log  /var/log/nginx/kaziforce.error.log warn;
}
