# Kaziforce — Nginx site configuration (HTTP, no domain required)
#
# Serves the built SPA from /var/www/kaziforce and proxies /api/ to the Node API
# on loopback. The model service (ml/service.py) binds 127.0.0.1:8000 and is
# deliberately NOT proxied here: there is no location block for it, so it is
# unreachable from the public internet. Do not add one.
#
# Install to /etc/nginx/sites-available/kaziforce, then:
#   sudo cp deploy/nginx/kaziforce-headers.conf /etc/nginx/kaziforce-headers.conf
#   ln -s /etc/nginx/sites-available/kaziforce /etc/nginx/sites-enabled/kaziforce
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# For HTTPS see kaziforce-https.conf.example (run certbot first).
#
# ---- Request log and abuse limits ------------------------------------------
# The JSON access log carries the API's correlation id (the API echoes it in
# the x-correlation-id response header) and the per-request latency, so the 5xx
# rate and the p95 latency are computable from these lines alone — see
# docs/OPERATIONS.md §Observability. log_format lives at this level because the
# file is included into the http block.
#
# limit_req zones run in FRONT of the API's own in-process rate limiter:
#  - sign-in: 10 requests/minute per client IP (burst 5) — human logins never
#    hit it, password spraying is throttled at the edge;
#  - CSV export: 6 requests/minute per client IP (burst 2) — the heaviest
#    endpoint (measured ~1 s/request at 50k rows, docs/PERFORMANCE.md §3).
# Exceeding a zone answers 429 (limit_req_status), mirroring the API's own
# refusal status.
log_format kaziforce_json escape=json
    '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"latency_s":$request_time,"corr_id":"$sent_http_x_correlation_id"}';

limit_req_zone $binary_remote_addr zone=kaziforce_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kaziforce_export:10m rate=6r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;

    # Without a domain, replace with the VPS public IP (or leave the default
    # server so any Host header matches). With a domain:
    #   server_name kaziforce.example.com www.kaziforce.example.com;
    server_name _;

    root /var/www/kaziforce;
    index index.html;

    # Uploads are not part of this console; keep the body limit small.
    client_max_body_size 1m;

    # Structured access log (JSON, with correlation id and latency).
    access_log /var/log/nginx/kaziforce.access.log kaziforce_json;

    # ---- Security headers (see kaziforce-headers.conf) --------------------
    include /etc/nginx/kaziforce-headers.conf;

    # ---- Compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- API proxy --------------------------------------------------------
    # TRUST_PROXY must be set in the API environment so the rate limiter sees
    # the real client IP from X-Forwarded-For.
    location /api/ {
        include /etc/nginx/kaziforce-headers.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # Never cache API responses or the audit CSV.
        add_header Cache-Control "no-store" always;
    }

    # Sign-in is the credential gate: edge-throttled per client IP.
    location = /api/v1/auth/login {
        limit_req zone=kaziforce_login burst=5 nodelay;
        include /etc/nginx/kaziforce-headers.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # The audit CSV is the heaviest endpoint: edge-throttled per client IP.
    location = /api/v1/audit/export.csv {
        limit_req zone=kaziforce_export burst=2 nodelay;
        include /etc/nginx/kaziforce-headers.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # ---- Static assets ----------------------------------------------------
    # Vite emits content-hashed filenames under /assets, safe to cache hard.
    location /assets/ {
        include /etc/nginx/kaziforce-headers.conf;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin an old bundle.
    location = /index.html {
        include /etc/nginx/kaziforce-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ---- SPA fallback -----------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Hardening --------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_log  /var/log/nginx/kaziforce.error.log warn;
}
