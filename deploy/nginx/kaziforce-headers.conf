# Kaziforce — security-header snippet.
#
# This file exists because of Nginx's add_header inheritance rule: a location
# that declares ANY add_header of its own loses every server-level header, so
# the headers are kept in one snippet and included in the server block AND in
# every location that declares its own headers (/api/, /assets/, =/index.html,
# and the limited /auth/login and /audit/export.csv blocks).
#
# Install to /etc/nginx/kaziforce-headers.conf (deploy/azure-vm-install.sh does
# this); every kaziforce server configuration includes it as:
#   include /etc/nginx/kaziforce-headers.conf;
#
# The SPA loads fonts from Google Fonts; Tailwind emits inline style blocks, so
# style-src needs 'unsafe-inline'. If you edit this, run nginx -t and test the
# console in a browser afterwards — a wrong CSP silently breaks the page.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
